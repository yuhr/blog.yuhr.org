e dateTime="2024-03-19T04:13:18Z" title="2024-03-19T04:13:18Z" class="block text-[.8rem] text-gray-500 dark:text-gray-400">2024-03-19</time><a href="/articles/6">FLOSSのIssue消化戦略</a></li><li><time dateTime="2024-02-02T12:46:34Z" title="2024-02-02T12:46:34Z" class="block text-[.8rem] text-gray-500 dark:text-gray-400">2024-02-02</time><a href="/articles/5">Twitter辞めて本当に良かった⋯⋯</a></li><li><time dateTime="2023-06-08T12:59:13Z" title="2023-06-08T12:59:13Z" class="block text-[.8rem] text-gray-500 dark:text-gray-400">2023-06-08</time><a href="/articles/3">Soft Tabs Are Hard</a></li><li><time dateTime="2023-04-30T23:05:04Z" title="2023-04-30T23:05:04Z" class="block text-[.8rem] text-gray-500 dark:text-gray-400">2023-04-30</time><a href="/articles/2">崩壊スターレイルやってる</a></li><li><time dateTime="2023-04-26T02:44:59Z" title="2023-04-26T02:44:59Z" class="block text-[.8rem] text-gray-500 dark:text-gray-400">2023-04-26</time><a href="/articles/1">ブログを立ち上げた</a></li></ol></section></main><footer class="container mx-auto max-w-2xl px-8 py-12 text-sm"><nav><ul class="flex flex-row gap-6 justify-center"><li><a href="/"><a class="text-gray-900 visited:text-gray-900 dark:text-gray-300 dark:visited:text-gray-300">Home</a></a></li></ul></nav></footer></div></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"issues":[{"body":"筆者の音響機器遍歴は以下のとおり偏っているので大部分の人にはあまり参考にならないかもしれないが、似たような遍歴の希少な読者のために書く。\n\n凡例: [HP]ヘッドフォン、[EP]イヤフォン、[SP]スピーカー、[IF]オーディオインターフェース\n\n- （2009年以前（小学生時代）は何かしらの安価ヘッドフォン（3000円前後）を使っていたはずだが憶えていない）\n- [HP] [beyerdynamic DT 250](https://beyerdynamic.co.jp/product/dt-250/): 2010年ごろ購入、DT 1990 PROに乗り換えるまで愛用。楽器屋でMDR-CD900STなどの同価格帯のモニター機と聴き比べて一瞬でベイヤー信者になりこっちにした思い出。\n- [SP] Logicool Z120BW: 2013年購入。なんとまだ現役。もちろん制作用途ではなく動画視聴など。ちゃんとしたスピーカーは適切に設置するためのコストが嵩むので手が出ない。\n- [EP] Fostex KOTORI: 2013年ごろ購入、数年後紛失。通学中にiPhoneで使用していた。おしゃれさ優先。\n- [EP] Etymotic Research hf5: 2015年1月購入、2017年ごろ破損。主にiPhoneで使用。装着すると無音になるし音質も素晴らしく、コスパ最高だったので生産終了しているのが残念でならない。これでエティモのことを好きになり、今でもER4SRとか普通に欲しいが、現在の生活スタイルでは持て余す予感。\n- [IF] Roland Rubix22: 2017年8月購入。音楽制作側に興味を持ち始めたのがこの頃で、MIDIキーボードなども購入した。それまでは何経由で音を鳴らしていたかよく憶えていないので、おそらくPC直挿し（！！）。\n- [HP] [SONY MDR-Z1000](https://www.sony.jp/headphone/products/MDR-Z1000/): 2017年8月購入。しばらく使ったが解像感が物足りずDT 250に戻り、こちらは売却。\n- [HP] [beyerdynamic DT 1990 PRO](https://beyerdynamic.co.jp/product/dt-1990-pro/): 2018年2月購入、2025年5月破損。奮発して上位機種に手を出してみたが大正解だった。MK IIも欲しい。\n- [HP] nura nuraphone: 2019年ごろ購入。音はそれなり。装着感があまり良くなく、ほぼ使っていない。\n- [EP] nura nuraloop: 2020年ごろ購入。音はそれなり。ノイキャンは結構優秀（hf5の耳栓性能には遠く及ばない）。外音取り込み機能もあるので出先では今はこれ。\n- （2020年ごろDJを始めた）\n- [IF] MOTU M2: 2021年11月購入。音楽体験が上次元にアセンションしてしまうので万人におすすめしたい。\n- [EP] final E500: 2022年11月購入。DLsite音声作品用途で現役。音楽には使えない。\n- （2023年ごろ本格的にDTMを始めた）\n- [HP] [OLLO Audio S5X 1.1](https://olloaudio.com/products/s5x-1-1-reference-headphones): 2025年6月購入。現在のメイン機。\n- ここに書いたもの以外にもこまごまと買ってはいるが、通話用だったり骨伝導だったりと色物なので除外した。\n\n長らく使っていたDT 1990 PROを床に落下させて左ドライバーユニットを壊してしまったので、この機会に最近話題になっていたOLLO AudioのS5Xを買ってみた次第。\n\n---\n\n結果、以下の点以外は全部**S5Xの方が良い**と感じた。\n\n- ヘッドバンドからのイヤーユニットの引き出し具合を固定する機構がなく、装着するたびにズレを調整しなければならず不便。\n- それまで使ってたDT 1990 PROと比べると長時間の装着では耳が少し痛くなってくる（頭骨や耳介の形、髪型、眼鏡やピアスの有無など、装着感は人それぞれ異なる要素の相乗効果なので、この評価は決して誰も参考にすべきでない）。\n- 高域の表現力はDT 1990 PROにあと一歩及ばない。\n- 公称でDT 1990 PROは40kHzまで出るのに対してS5Xは22kHz。人間の可聴域は20kHzまでなのだから気にするべきでないという人もいるが、そこで音が出ている限りは差音が発生し可聴域に何かしらの影響はあるはず。\n\nやはり中高域の生々しさはDT 1990 PROの方が精細に感じられた。「Beyer treble」としてよく知られているとおり、DT 1990 PROにも典型的なトレブルピークがあり、これが苦手な人は苦手らしいが、筆者は逆にそこが耳に心地よく感じるタイプであった。ただしこれはあくまでリスニング的な評価（中高域表現力があまりに高すぎて、一般的ではない再生環境に耳が慣れてしまう）なので、リファレンスとしてはS5Xの方が正解に近いと思う。もちろんS5Xも単体で見れば非常に精細である。\n\n冒頭の遍歴を見て大体わかるかもしれないが、筆者はむしろSONYのヘッドフォンような、高域がはっきりせず低域ボッフボフの音が嫌いである。聴いていて生きた心地がしないくらいには。リファレンスやモニターと謳っているミドルハイエンド以上の製品ですらそうなので、開発陣は本当にあれでいいと思っているのだろうし、実際に業務で使用している人もいるはずなので、つまるところ実際にはある程度のラインをクリアすれば周波数特性に絶対的な優劣などなく、人それぞれ特性に偏りのある色眼鏡（耳）で物を見ているからそれを補正するような特性の逆色眼鏡（ヘッドフォン）を選べばいいというだけの話なのだろう。\n\nS5Xは立体音響のモニタリングに最適とされているようで、確かに空間表現はDT 1990 PROより優っているように感じられる。とはいえDT 1990 PROも悪いわけでは決してなく、方向性の異なる空気感がある。表現が難しいが、S5Xの空間は前後に開けていて、部屋にいる自分をさらに別の自分がサードパーソンで見下ろしているかのような冷静な空気感であり、一方DT 1990 PROの空間は上下に開けていて、屋外にいながらファーストパーソンで目の前の物を見ているかのような鮮明な空気感である。単に個々の音の解像感、分離感という意味ではどちらも良い勝負だが、全体的にはS5Xの方が全方向への均等な広がりを俯瞰しているように感じられる分、S5Xの方が上と言ってもいいかもしれない。筆者は今のところ特に立体音響を意識した制作はせず普通のステレオのみだが、それでも音の聴き分けにおいて恩恵を感じられる。\n\n装着感に関して今のところベイヤーの右に出るものはいないと感じる。ローエンドモデルのDT 250ですらそうだった。筆者の頭骨の形状に対して力のかかり方がちょうどよく、強すぎず弱すぎずの絶妙な力加減で、全く疲れずに作業を続けられる。ベイヤーのそれを知らなければS5Xも最高と言えたかもしれないが。この辺は本当に装着者との相性であり、たまたま筆者の頭がbeyerdynamic社内でモデルとしている頭の形状に近いのだろう。\n\n総じて、少なくとも今年買ってよかったものランキングの上位には躍り出そうな気配である。\n\n---\n\n余談だが、包括的にヘッドフォンや再生環境のことを知りたいなら[DIY-AUDIO-HEAVEN](https://diyaudioheaven.wordpress.com)を見るとよい。大体何でも載ってる。","active_lock_reason":null,"assignee":null,"assignees":[],"author_association":"OWNER","closed_at":null,"comments":0,"comments_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/10/comments","created_at":"2025-07-18T15:54:51Z","events_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/10/events","html_url":"https://github.com/yuhr/blog.yuhr.org/issues/10","id":3243667211,"labels":[],"labels_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/10/labels{/name}","locked":false,"milestone":null,"node_id":"I_kwDOJbYSL87BVm8L","number":10,"performed_via_github_app":null,"reactions":{"+1":0,"-1":0,"confused":0,"eyes":0,"heart":0,"hooray":0,"laugh":0,"rocket":0,"total_count":0,"url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/10/reactions"},"repository_url":"https://api.github.com/repos/yuhr/blog.yuhr.org","state":"open","state_reason":null,"sub_issues_summary":{"completed":0,"percent_completed":0,"total":0},"timeline_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/10/timeline","title":"OLLO Audio S5Xとbeyerdynamic DT 1990 PROの比較感想","updated_at":"2025-07-18T15:58:27Z","url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/10","user":{"avatar_url":"https://avatars.githubusercontent.com/u/18474125?v=4","events_url":"https://api.github.com/users/yuhr/events{/privacy}","followers_url":"https://api.github.com/users/yuhr/followers","following_url":"https://api.github.com/users/yuhr/following{/other_user}","gists_url":"https://api.github.com/users/yuhr/gists{/gist_id}","gravatar_id":"","html_url":"https://github.com/yuhr","id":18474125,"login":"yuhr","node_id":"MDQ6VXNlcjE4NDc0MTI1","organizations_url":"https://api.github.com/users/yuhr/orgs","received_events_url":"https://api.github.com/users/yuhr/received_events","repos_url":"https://api.github.com/users/yuhr/repos","site_admin":false,"starred_url":"https://api.github.com/users/yuhr/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/yuhr/subscriptions","type":"User","url":"https://api.github.com/users/yuhr","user_view_type":"public"}},{"body":"In recent decades, a number of package ecosystems have been built around the concept of [Semantic Versioning](https://semver.org) (SemVer hereafter) in the wild. To me, this seems absurd from the perspective of reliable systems engineering.\n\n## Problem: You Have to Trust Your Ability to Version\n\nTo get started in SemVer, the first problem you have to deal with is to decide which number to bump for your releases. There will be almost no reduction in the cognitive load required to make these decisions, even after dozens of releases you published. You sometimes might include breaking changes into a minor release by mistake, or even if you believe that the change is definitely nonbreaking before releasing, eventually your users might experience the change as breaking.\n\nThe more disappointing fact is that there's no general algorithm to prove a version tag is correct for a release—it's simply impossible. The correctness varies depending on the situation of the software. For example, when you noticed a seemingly undesirable behavior in your library, do you think the release fixing the behavior is patch level, or major level? You would think it's a patch as usual, but what if you know one of downstream softwares has code that depends on that behavior? Or what if you know almost all of downstream do so? Or what if *actually* they do so while you can't even know? Library authors have to consider such situations all along upon their releases. Of course it's correct to release as “a patch because it's undesirable on its own”, and still other options are also downright correct like “a patch because the dependents are ignorably few” and “a major because the dependents are considerably numerous”. But I'd say not so many developers could decide like that confidently and bravely.\n\nUnder SemVer, no matter how confident a developer believes their change is really great, they have to be overcareful when releasing. SemVer forces library authors to suffer from being seized with fear that they might break uncountable builds of softwares anywhere in the world.\n\n### Pseudosolution: Do Not Trust Your Ability to Version\n\nBump the major version only. There's no one who can recognize every single usage of their library, thus it's always *better* choice to go for releasing as a major.\n\nAs you notice, SemVer doesn't make sense anymore if you always release as a major.\n\n## Problem: You Have to Trust Every Developer's Ability to Version\n\nOnce you've got a misversioned library in the dependency graph of your software, you shall confront unhelpful build errors while autoupdating your dependencies, or users might experience a bug after a release. The idea of “compatibility between versions” is all too often a fantasy.\n\nSystems built on top of SemVer only works as long as such vulnerable relationships of interhuman trust is working. One could say the idea of reusing libraries made by someone is itself already based on some kind of trust, but wait, the greatness of a software and the ability to develop such a software are totally different thing than the ability to version. Library updates are always likely to cause broken builds regardless of how much the library is great.\n\n### Pseudosolution: Don't Trust Every Developer's Ability to Version\n\nPin each of your dependencies to a specific version.\n\nAgain, SemVer will become useless then.\n\n## The Worst Abusage Ever: Deduplication\n\nUnfortunately, most package managers not only deduplicate dependencies as per SemVer by default, but even don't support disabling it! While deduplication must be carefully done by involved developers preferably manually ensuring the version combination really works well in that specific situation, current systems automatically deduplicate as much as possible as per the version range requirements in the dependency graph. The infamous “[dependency hell](https://en.wikipedia.org/wiki/Dependency_hell)” all comes out of this process, but this is how it is done.\n\nI'd agree with [this topic in the users forum of Rust](https://users.rust-lang.org/t/psa-please-specify-precise-dependency-versions-in-cargo-toml/71277), especially the following sentence in [this comment](https://users.rust-lang.org/t/psa-please-specify-precise-dependency-versions-in-cargo-toml/71277/23):\n\n\u003e And so I say: if you’re not deliberately testing on minimal versions, all approaches other than exact version dependencies (like `serde = \"=1.0.130\"`) are Wrong™.\n\nAlmost every library would be developed by a single developer (at least initially), and with such a low development resource it's too hard to ensure their library works with every possible combination of versions of the dependencies. **No two versions of a library should be considered compatible unless tested explicitly**. I believe this is supposed to be the baseline concept of software development. \n\nSounds radical? Yes, radically installing multiple copies of the same library might cause special-case problems in turn, for instance:\n\n- **Mutable statics**. Libraries that internally use static area as a global mutable state might not work correctly. Mutating statically allocated memory must be a deprecated idea for any future software development. Instead, we should be passing states all around as arguments like done in functional-styled programming.\n- **Type system**. In major implementations of nominal type systems, types with the same name but from different versions are actually treated as completely different ones, thus cannot be used interchangeably. This is just a false problem where language design tightly couples the identity of types with *where it was defined*. Instead, language designers should find a way to identify types by *what purpose it was defined for*.\n\nThese points should be thought of as temporary thing in the migration period to the next technological innovation that eliminates any form of dependency hell.\n\n## Core Purpose of SemVer\n\nReading down to this section, you already understand that mechanically relying on systems based on SemVer (like package managers) is inherently problematic. Then what's the point of SemVer?\n\nSemVer is just a convention. Nothing more, nothing less. Sometimes wrong versioning is made, because the versioner is a human. It's no surprise that we (humans!) make mistakes, but unfortunately we've been still making the biggest mistakes these days: trying to build reliable systems on top of a mere convention.\n\nThe heart of SemVer is literally “semantic” versioning; this means that SemVer is purely for humans, not for machines. One of the dark side of SemVer is that it defines the machine readable form of version tags, and looks promising about compatibility between versions of softwares, while actually it doesn't guarantee the semantics at all. These version tags are just given as a hint for users by the developer, and it's all up to users to trust this hint. Pessimists like me would think the hint is almost meaningless, but quite a few people wouldn't think so, and probably that's why SemVer gained this popularity.\n\n## Real Solution: Stop Using “Packages”\n\nThose pseudosolutions are just workarounds under the reign of packages. If possible, humanity should progress to the direction not relying on “packages”. It might sound ridiculous, but I mean somewhat more specific: just **to stop thinking about software development ecosystems in the unit of packages**. At least developers of a new programming language should reconsider whether to involve the concept of package into their automation systems.\n\nFundamentally, I think it's pointless to release softwares at the granularity of package. It's rather reasonable to give a version number for each public API (exported symbol) and release separately.\n\nThere're multiple issues in releasing in the unit of packages. For example:\n\n- When a major version of a package is released with some bugfixes, users who are not using the part of the APIs the breaking change was made on will receive an impact that they can't get a very simple bugfix to the part they're using without investigating and validating the whole released contents. Not all developers have resource to provide backports.\n- Package authors have to manage a complex schedule to determine the order in which they merge changes, to reduce the impact described above as much as possible.\n- The more a package grows large, the more the difficulty of versioning gets increased. A large package means a large cognitive load to understand the relationships between the public APIs.\n\nPer API versioning addresses these cases, although whether we should use SemVer again or not anymore for tagging versions would be another debatable topic.\n\n---\n\nFurther reading:\n\n- There's already a study called [version polymorphism](https://prg.is.titech.ac.jp/papers/pdf/thesis-m/2020-tanabe.pdf) that proposes a core calculus enriched with version numbers and statically verify compatibility of programs.\n- The [Unison](https://www.unison-lang.org) programming language implements a thrilling idea: [the global content-addressed syntax forest library called “codebase”](https://www.unison-lang.org/docs/the-big-idea/). This consequently deduplicates code instead of packages, in a sound manner.","active_lock_reason":null,"assignee":null,"assignees":[],"author_association":"OWNER","closed_at":"2025-05-09T00:54:14Z","comments":0,"comments_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/9/comments","created_at":"2025-05-09T00:12:52Z","events_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/9/events","html_url":"https://github.com/yuhr/blog.yuhr.org/issues/9","id":3050416641,"labels":[],"labels_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/9/labels{/name}","locked":false,"milestone":null,"node_id":"I_kwDOJbYSL8610aoB","number":9,"performed_via_github_app":null,"reactions":{"+1":0,"-1":0,"confused":0,"eyes":0,"heart":0,"hooray":0,"laugh":0,"rocket":0,"total_count":0,"url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/9/reactions"},"repository_url":"https://api.github.com/repos/yuhr/blog.yuhr.org","state":"closed","state_reason":"completed","sub_issues_summary":{"completed":0,"percent_completed":0,"total":0},"timeline_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/9/timeline","title":"Semantic Versioning Is Abused","updated_at":"2025-05-09T00:54:14Z","url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/9","user":{"avatar_url":"https://avatars.githubusercontent.com/u/18474125?v=4","events_url":"https://api.github.com/users/yuhr/events{/privacy}","followers_url":"https://api.github.com/users/yuhr/followers","following_url":"https://api.github.com/users/yuhr/following{/other_user}","gists_url":"https://api.github.com/users/yuhr/gists{/gist_id}","gravatar_id":"","html_url":"https://github.com/yuhr","id":18474125,"login":"yuhr","node_id":"MDQ6VXNlcjE4NDc0MTI1","organizations_url":"https://api.github.com/users/yuhr/orgs","received_events_url":"https://api.github.com/users/yuhr/received_events","repos_url":"https://api.github.com/users/yuhr/repos","site_admin":false,"starred_url":"https://api.github.com/users/yuhr/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/yuhr/subscriptions","type":"User","url":"https://api.github.com/users/yuhr","user_view_type":"public"}},{"body":"何かがスケールすると発生し始める問題の一つに、「FLOSSの有名税」とでも言うべきものがあると筆者は考えている。\r\n\r\n以前、[expressjs/express](https://github.com/expressjs/express)がスパムPR爆撃を受けていた件が[話題](https://socket.dev/blog/express-js-spam-prs-commoditization-of-open-source)になっていた。ざっくり言うと、GitHubのPRの作り方を説明するチュートリアルをYouTubeに出していたIT教育系動画投稿者がいて[^0]、それを観た大量のバカが実際にスパムPRを作成しまくったという事件だ。\r\n\r\nexpressjs/expressの件はさすがに極端な例だけど、そこまでいかなくとも、そのソフトウェアが有名になるにつれて、作成される（スパムではない）Issueが多すぎてメンテナーが対処しきれなくなるという事態は往々にして発生する。これ自体は仕方のないことだし、メンテナーが疲弊するのも理解できるが、そのせいで自動クローズbotみたいな仕組みを導入し始めるのは、いくらメンテナンスが大変でもやってはいけないことだと思う。それは隠密的なメンテナンスの放棄に等しいし、Issueという仕組みの意義を破壊してしまう。問題があってIssueが作成されたのであれば、問題が解決していないのにIssueをクローズするのは、メンテナーの自己満足、欺瞞であり、臭いものに蓋をしているだけである。それをわかっていてやるのであればまだいいが、メンテナーは本当にその不評を被る覚悟があるのだろうか。\r\n\r\n---\r\n\r\n自動クローズbotの導入方法がGitHubの公式ドキュメントに[書かれている](https://docs.github.com/en/actions/managing-issues-and-pull-requests/closing-inactive-issues)ということも、なかなかに信じがたい。Issueのクローズ理由の一つに“stale”があるので、動きがないIssueをクローズするというのはGitHub的には正当なのかもしれない。\r\n\r\n\u003cimg width=\"328\" alt=\"Screenshot 2024-03-18 at 15 19 05\" src=\"https://github.com/yuhr/blog.yuhr.org/assets/18474125/031d9a2e-018a-473b-8afe-d4ccb0984af2\"\u003e\r\n\r\n個人的には、Issueの分類やクローズ理由としての“stale”というのは、ソフトウェアの他の部分で機能追加したりバグ修正したりすることによって、そのIssueに挙げられた問題が副作用的に解決していた場合を指しているのかと思っていたが、その認識がおかしいのかもしれない。というか、そもそも「解決していた」なら“resolved”扱いでいいのかもしれない。そうなってくると、筆者の立場としては、クローズ理由から“stale”を削除するべきという話になる。\r\n\r\n---\r\n\r\n「ソフトウェアに問題がある」という旨のIssueを「Issue作成日時が古いから」という理由でクローズしていいケースというのは存在しない。表立ってメンテナンスを放棄していたとしても、である。オープンなIssueは「治っていない問題」の一覧であり、いくら古くても問題が残っている限りIssueを残しておかなければならない。それがメンテナンス放棄ということの意味である。\r\n\r\n手動で作成された、ちゃんと意味のあるIssueを自動で[^1]クローズしていいケースというのも存在しない。Issue消化に関する自動化として最大限考えうるのは、「重複するかもしれない既存のIssueをAIでリストアップしてチェックボックスを出しておき、メンテナーによってチェックされたらそのIssueのduplicateとしてクローズする」とか、「質の低い（再現手順がないなど）可能性のあるIssueにそういうタグをつける」などといった、あくまで「判断をメンテナーに任せる」自動化だけだろう。\r\n\r\nあまりGitHubでIssueを漁ることがない人には、何を当たり前のことをと思われるかもしれないが、実際にそうやってクローズされているIssueがGitHubにはたくさんある。特に大きいプロジェクトほどそのような傾向が認められる。\r\n\r\n---\r\n\r\n思うに、自動クローズなどをやり始めてしまうのは、Issueをカスタマーサポートのようなものだと考えているメンテナーたちだろう[^2]。カスタマーサポートというものは、その成り立ちからして、問題ベースではなくカスタマーからのアクションベースで動いているものだ。苦情がなければ動かなくていいという行政的な考えと、自動クローズとの間には親和性がある。しかしFLOSSにおいては、ユーザーとメンテナーを立場上分離するような考え方や、それら人間を中心とする考え方ではなく、ソフトウェアそれ自体を中心とする考え方で開発を進めるべきだし、それに基づけば、メンテナーの労力の都合でソフトウェアの問題がなかったことにされるというのは、発想すらあり得ないような事態だ。\r\n\r\n正しい方法で大量のIssueに対処するなら、各メンテナーの稼働時間を増やすか、メンテナーの数を増やすしかないのだが、それはそれでまた別の問題が発生するおそれが出てくるので、難しい。とにかく、何かがスケールすればするほどその世界は崩壊に向かっていく、というのが自然の摂理なのだろう。政治の直面する不可能そのものである。結局のところこれは倫理や良心の問題であって、考え方が異なる人たちがいる以上、無くなることはないのかもしれない。\r\n\r\n---\r\n\r\n[^0]: 一応、少なくともコメントでは「実際にはテスト用のPRを送らないように」という旨の[免責文](https://www.youtube.com/watch?v=Ez8F0nW6S-w\u0026lc=UgyjLIPaIm6z029WBhp4AaABAg)が出されてはいる。筆者は動画本体は観ていないので確かなことは言えないが、動画の中にも同じ旨の注意はあったらしい。\r\n[^1]: 「自動で」というのは「人間の判断なく」という意味。関連付けられたPRのマージに従ってクローズされるケースは、人間の判断によるので含まない。\r\n[^2]: メンテナーにそう思わせてしまうGitHubのUIにもいささか問題があるかもしれないが、かといってどうデザインすればいいのかという案は筆者には湧いてこない。おそらく、そもそもGitHubのような場所で中央集権的にソフトウェアを管理するのをやめる必要がある。","active_lock_reason":null,"assignee":null,"assignees":[],"author_association":"OWNER","closed_at":"2024-03-25T04:25:07Z","comments":0,"comments_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/6/comments","created_at":"2024-03-19T04:13:18Z","events_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/6/events","html_url":"https://github.com/yuhr/blog.yuhr.org/issues/6","id":2193973359,"labels":[],"labels_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/6/labels{/name}","locked":false,"milestone":null,"node_id":"I_kwDOJbYSL86CxWBv","number":6,"performed_via_github_app":null,"reactions":{"+1":0,"-1":0,"confused":0,"eyes":0,"heart":0,"hooray":0,"laugh":0,"rocket":0,"total_count":0,"url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/6/reactions"},"repository_url":"https://api.github.com/repos/yuhr/blog.yuhr.org","state":"closed","state_reason":"completed","timeline_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/6/timeline","title":"FLOSSのIssue消化戦略","updated_at":"2024-03-25T04:25:08Z","url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/6","user":{"avatar_url":"https://avatars.githubusercontent.com/u/18474125?v=4","events_url":"https://api.github.com/users/yuhr/events{/privacy}","followers_url":"https://api.github.com/users/yuhr/followers","following_url":"https://api.github.com/users/yuhr/following{/other_user}","gists_url":"https://api.github.com/users/yuhr/gists{/gist_id}","gravatar_id":"","html_url":"https://github.com/yuhr","id":18474125,"login":"yuhr","node_id":"MDQ6VXNlcjE4NDc0MTI1","organizations_url":"https://api.github.com/users/yuhr/orgs","received_events_url":"https://api.github.com/users/yuhr/received_events","repos_url":"https://api.github.com/users/yuhr/repos","site_admin":false,"starred_url":"https://api.github.com/users/yuhr/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/yuhr/subscriptions","type":"User","url":"https://api.github.com/users/yuhr"}},{"body":"というのは嘘で、この記事はむしろ私が熱心にツイートしていた時代にTwitterの何が良かったのかを思い返して述べるものであって、何が悪かったのかについてはすでに巷で無限に議論があると思うし、そのほとんどに私は同意するだろうので、ここではあまり言及しないでおく。\r\n\r\n「Twitter辞めて本当に良かった⋯⋯」は、いつから始まったのかはわからないがそういう定型文のミームであり、Twitter上でそう呟くからこそ面白いのであって、今回は単に私がそれを懐かしんでいるから表題にしたに過ぎず、特に意味はない。\r\n\r\n---\r\n\r\nまずそもそもなぜツイートしなくなったかというと、それ以外のことで忙しいからである。私が移行先として使っているNostrも、今はほぼポストしておらず、見てもいない。使っているかどうかでいうと、どちらかと言えば今のところTwitterの方が使っていると言える。ただ、本拠地はNostrであるという意識は捨ててはいない。今後も何か短文投稿することがあればNostrに流す。Nostrの何が良いかという話は別で記事にするかもしれない。\r\n\r\nでは何に勤しんでいるかというと、色々である。以前から作ろうと思っていたソフトウェア開発にいよいよ本腰を入れ始めたり、DJ趣味が飛び火してDTMに手を出すなどした[^0]。主にこの2点が今の私の生活の大半を占めている。あとはゲーム。\r\n\r\n---\r\n\r\nここからが本題。ツイートしなくなって感じたのは、何かについて本格的に思考することが明らかに減った、ということだ。これは私の狙い通り（前述したような趣味のために手を動かす時間を確保したかった）ではあるので、後悔してはいないのだが、ツイートするという行為が私にとっていかに思考を触発するものであったかということに気付かされ、少し不思議に感じた。\r\n\r\nこれはあくまで「私にとっては」という注釈付きなのだが[^1]、連ツイすることで「[**意識の流れ**](https://ja.wikipedia.org/wiki/意識の流れ)」をそのままに実現していたようなものかもしれない。しかし、単にそれを実現するだけなら、プライベートなメモ帳などに適当に一つ一つ書きつければ済む話である。しかし、どうにもそれはやってみたところで（ツイートのようには）続かないだろうということは予感できる。ではそれはなぜか、と考えたときに思い当たるのは「張り合い」くらいなものだろう。意識の流れをパブリックな場で垂れ流すことは、様々な危険が伴うことではあるが[^2]、むしろそのような危険があったからこそ筆が進んでいた、という側面があったことは確かだ。少なくともある程度は、後から（あるいは外から）読み返して意味が通るような文を書かなければいけないし、社会不適合的な考えをある程度は社会適合的な表現でラップしなければならないし、考えは一貫していなくてもいいけれどもその変化がわかるように書いておかなければならない[^3]。これは読みやすさのためだとか、記録のためだとか*ではなく*[^4]、そういう神経を働かせることで辿り着ける「**思考の境地**」[^5]というのがあったのである。脳トレと言い換えてもいい。つまり、プライベートなメモ帳に書いていただけでは考えもしなかったような帰結に思い至ることができる、ということだ。仕組みはわからないが、シンプルに思考継続力や直観力にブーストが掛かるのである。私は以前から、よく言われる常識に反して「Twitterは議論に向いて*いる*」と感じていたが、その実態はそういうことだったのかもしれない。\r\n\r\nもちろん、パブリックに思考を垂れ流すことで外部からのアイデアが飛んでくることもあり、それによって初めて到達できる思考の境地もある。しかし、その恩恵を受けるためにはまず自分の思考力が持続している必要がある。ツイートによって思考することは、私にとってその前提を確保するために必要なことだったのである。\r\n\r\n---\r\n\r\n上述したような点以外で、ツイートすることによる利点は特に感じない[^6]。というか、私にとってその利点は同時に欠点でもある。仮に私が執筆作業を本懐とする人間であれば、*何かについての*思考はそれについての執筆を捗らせるが、残念ながら今の私はそのような意欲をあまり持っていない（まったく興味がないわけではないが）。Nostrでもほぼポストしていないのはそのためである。最近は短文投稿SNSの代わりにYouTubeを見ていることが多い。今考えると、私が数年前まで盛んにTwitterをやっていたのは、おそらく今やっていることの「準備期間」だったからというような気がしている。\r\n\r\n「良いものができる」と信じることができているときは、とても捗る。逆に言うとそのときぐらいしか生きている実感がない。\r\n\r\n---\r\n\r\n[^0]: 楽曲制作者としての名義をこちらに繋げるつもりはない。\r\n[^1]: とはいえ実際、一定数の人間には同じことが当てはまるのではないかと思う。\r\n[^2]: その危険が何かということにはここでは深く触れないが、ざっくり言うと、プライベートな場では問題にならないような考えが一瞬でグローバルに配信されることからくる様々な問題のこと。\r\n[^3]: もちろんこれは誰に課されたわけでもなく、実際に徹底できていたわけでもない、単なる私の内的自然である。\r\n[^4]: むしろ私はある時期から、私の短文投稿を私の思考の記録として捉えることは、他者からはもちろんのこと自分から見ても、長期的に考えると非合理的であるという考えを抱くようになった。それらの記録からでは、いくら注意深く書いていたとしても、当時の自分の現状認識と意識の流れにはどうやっても辿り着くことができないからである。ここら辺の捉え方は人によると思う。思考のうんこである短文投稿よりはむしろ、当時観ていたアニメのワンシーンや読んでいた本の引用などの方が私にとっては記録としての価値がある。\r\n[^5]: これは一次元的な価値判断に基づく概念ではなく、マインドマップ的な平坦な空間における、単なる一部の領域をイメージしている。そのような領域にある帰結が、必ずしもそれ以外の領域にある帰結よりも優れていると言いたいわけではない。到達できる領域が広がるという話である。\r\n[^6]: 強いて言うなら「人間関係をやれること」くらいだろう。私の欲動は基本的に自分一人で閉じているので、自分を含む人間関係には根本的には意義を感じない。","active_lock_reason":null,"assignee":null,"assignees":[],"author_association":"OWNER","closed_at":"2024-02-08T11:29:15Z","comments":0,"comments_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/5/comments","created_at":"2024-02-02T12:46:34Z","events_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/5/events","html_url":"https://github.com/yuhr/blog.yuhr.org/issues/5","id":2114851423,"labels":[],"labels_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/5/labels{/name}","locked":false,"milestone":null,"node_id":"I_kwDOJbYSL85-DhJf","number":5,"performed_via_github_app":null,"reactions":{"+1":0,"-1":0,"confused":0,"eyes":0,"heart":0,"hooray":0,"laugh":0,"rocket":0,"total_count":0,"url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/5/reactions"},"repository_url":"https://api.github.com/repos/yuhr/blog.yuhr.org","state":"closed","state_reason":"completed","timeline_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/5/timeline","title":"Twitter辞めて本当に良かった⋯⋯","updated_at":"2024-02-08T11:29:15Z","url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/5","user":{"avatar_url":"https://avatars.githubusercontent.com/u/18474125?v=4","events_url":"https://api.github.com/users/yuhr/events{/privacy}","followers_url":"https://api.github.com/users/yuhr/followers","following_url":"https://api.github.com/users/yuhr/following{/other_user}","gists_url":"https://api.github.com/users/yuhr/gists{/gist_id}","gravatar_id":"","html_url":"https://github.com/yuhr","id":18474125,"login":"yuhr","node_id":"MDQ6VXNlcjE4NDc0MTI1","organizations_url":"https://api.github.com/users/yuhr/orgs","received_events_url":"https://api.github.com/users/yuhr/received_events","repos_url":"https://api.github.com/users/yuhr/repos","site_admin":false,"starred_url":"https://api.github.com/users/yuhr/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/yuhr/subscriptions","type":"User","url":"https://api.github.com/users/yuhr"}},{"body":"Every time I hear people saying “hard” or “soft” when talking about indentation style, I feel it's the other way around, because what people call the “soft” way is to bake the visual width of indentation into the file, which can be thought as a typical instance of hardcoding, like in analogy with “hard wraps”.\r\n\r\nActually, they're saying “hard” or “soft” about “tabs”, not about “indentation”, so I understand it's okay to say baking tabs into the file as “hard tabs”. But wait...\r\n\r\nStrictly speaking, what exactly we want to do is to *perform indentation*, not to *insert tabs or spaces* specifically. Tabs or spaces are just two naïve implementations of indentation. It sounds unnatural to me to use the words like “hard *tabs*” and “soft *tabs*” when talking about indentation. I don't know who has started such wording, but this is the time to reconsider what those words mean.\r\n\r\nInstead I propose this wording: “**soft indentation**” and “**hard indentation**”. Just like the “soft wrapping” leaves where to insert line break to the renderer, “soft indentation” leaves how much width a single level of indentation takes to the renderer. On the other hand, “hard indentation” hardcodes it by encoding the width to the number of spaces. Quite natural, isn't it?\r\n\r\nTL;DR, the correspondence is:\r\n\r\n- **Soft indentation = Hard tabs**\r\n- **Hard indentation = Soft tabs**\r\n\r\nSo, remember, **soft tabs are hard**.","active_lock_reason":null,"assignee":null,"assignees":[],"author_association":"OWNER","closed_at":"2023-06-09T08:29:04Z","comments":0,"comments_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/3/comments","created_at":"2023-06-08T12:59:13Z","events_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/3/events","html_url":"https://github.com/yuhr/blog.yuhr.org/issues/3","id":1747848717,"labels":[],"labels_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/3/labels{/name}","locked":false,"milestone":null,"node_id":"I_kwDOJbYSL85oLg4N","number":3,"performed_via_github_app":null,"reactions":{"+1":0,"-1":0,"confused":0,"eyes":0,"heart":0,"hooray":0,"laugh":0,"rocket":0,"total_count":0,"url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/3/reactions"},"repository_url":"https://api.github.com/repos/yuhr/blog.yuhr.org","state":"closed","state_reason":"completed","timeline_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/3/timeline","title":"Soft Tabs Are Hard","updated_at":"2023-06-09T08:29:04Z","url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/3","user":{"avatar_url":"https://avatars.githubusercontent.com/u/18474125?v=4","events_url":"https://api.github.com/users/yuhr/events{/privacy}","followers_url":"https://api.github.com/users/yuhr/followers","following_url":"https://api.github.com/users/yuhr/following{/other_user}","gists_url":"https://api.github.com/users/yuhr/gists{/gist_id}","gravatar_id":"","html_url":"https://github.com/yuhr","id":18474125,"login":"yuhr","node_id":"MDQ6VXNlcjE4NDc0MTI1","organizations_url":"https://api.github.com/users/yuhr/orgs","received_events_url":"https://api.github.com/users/yuhr/received_events","repos_url":"https://api.github.com/users/yuhr/repos","site_admin":false,"starred_url":"https://api.github.com/users/yuhr/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/yuhr/subscriptions","type":"User","url":"https://api.github.com/users/yuhr"}},{"body":"今週末はずっと[崩壊スターレイル](https://hsr.hoyoverse.com/ja-jp/home)をプレイしていた。最初はスマホでやっていたのだが、原神と同じくこれは大画面で観たいという感じになりPCにインストールした。20GBくらい必要だった。\r\n\r\nﾍﾟﾗﾁｬﾝｶﾜｲｲﾔｯﾀｰ\r\n\r\n![ペラさんの肖像](https://user-images.githubusercontent.com/18474125/235380198-c3b0536b-09dc-4049-9256-88f3dd37887e.png)\r\n\r\n\r\n---\r\n\r\n主人公のキャラクター性がかなり面白い。主人公は記憶喪失で、経緯や出自が不明である[^1]。なにやら重要そうな「星核」というオブジェクトが物語冒頭で主人公の体内に埋め込まれるが、それがつまるところ何なのかもわからない。とはいえ、訳もわからず異世界に召喚され、これから星々を旅する冒険が始まる、といったような現状のことを「SF映画の世界にでも召喚されたの？」と形容するなど、普通に地球人間として生まれ育ったかのような思考様式を備えていることは看て取れる。あまり表情豊かではなく、常に超然としていながらも、行動は奇特で、喋り方は妙に俗っぽい。筆者はこのようなキャラクターに弱いのだと思う。ミステリアスな風貌と飄々とした言動。\r\n\r\nメッセージという機能があって、ゲーム内の他のキャラクターと主人公との会話が読めるのだが、これをすらすらと読めている自分に驚いた。他のゲーム（ブルアカやNIKKEなど）の類似する機能はだいたい読むのが億劫になってしまって放置してしまいがちなのだが、このゲームのメッセージは、そもそも絶対量が少なく現実的な数しか届かないということもあるが、おそらくそれを通して主人公の性格が窺い知れるということが、メッセージのやりとりを読み進める主な動機になっている気がする。仮にプレイヤー（筆者のことだが）が自己投影できてしまっていたら、単純に**自分自身が**会話相手のキャラクターに興味を持てるかどうかの問題になってしまうだろう。\r\n\r\n実際の主人公の言動やゲーム冒頭の雰囲気は[マシーナリーとも子の記事](https://news.denfaminicogamer.jp/kikakuthetower/230426a)を見てほしい。\r\n\r\n---\r\n\r\n全体的なUXはよく考えられている。戦闘部分はシンボルエンカウント方式のターン制バトルで、コマンド数が絞られており[^2]考えることが少なくて済むのと、必殺技だけ任意のタイミングで割り込み発動できるため、若干のアクション性があり退屈しない。そして特筆すべきは、**戦闘後のリザルト画面というものが存在しない**ことだ。場転がテキパキと進むおかげで、この手のゲームシステムでありがちな「だれている」感がない。\r\n\r\n姫子さんとヘルタさんの追加攻撃が強すぎる。追加攻撃に対しても追加攻撃が発生したりするので、ペラさんの秘技などで開幕攻撃→追加攻撃→追加攻撃みたいな感じで一切操作せずに戦闘が終了することがある。模擬宇宙の中では「愉悦」の祝福によってさらに追加攻撃が強化され、自動で敵が溶けていく。追加攻撃最高！ 一番好きな攻撃です！\r\n\r\n---\r\n\r\n操作体系はスマホ向けゲームをとりあえず移植しましたといった趣で、原神ほど洗練されておらず、UI上をカーソル移動しなきゃいけないことが多くて不便である。筆者はコントローラーでプレイしているが、一番の不満はキーコンフィグ機能の貧弱さで、自由に設定できるわけではなく、例えば「OK」と「キャンセル」ボタンは○か×しか割り当てられず、「通常攻撃」と「秘技」ボタンは□か△しか割り当てられない。あっても意味がない機能である。\r\n\r\nまた、このゲームにジャンプする機能はない。もちろんゲーム上まったく必要ではないからなのだが、こんなに精巧な3Dのマップとキャラクターがあってジャンプできないのはもどかしい。原神に飼い慣らされている。\r\n\r\n[^1]: 物語の導入部で主人公を記憶喪失にしたり殺したりするのは、観者が新しい物語に没入しやすくするための典型的な工夫である。\r\n[^2]: できることは「通常攻撃」「戦闘スキル」「必殺技」の三つしかない。","active_lock_reason":null,"assignee":null,"assignees":[],"author_association":"OWNER","closed_at":"2023-06-08T12:14:53Z","comments":0,"comments_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/2/comments","created_at":"2023-04-30T23:05:04Z","events_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/2/events","html_url":"https://github.com/yuhr/blog.yuhr.org/issues/2","id":1690122240,"labels":[],"labels_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/2/labels{/name}","locked":false,"milestone":null,"node_id":"I_kwDOJbYSL85kvTgA","number":2,"performed_via_github_app":null,"reactions":{"+1":0,"-1":0,"confused":0,"eyes":0,"heart":0,"hooray":0,"laugh":0,"rocket":0,"total_count":0,"url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/2/reactions"},"repository_url":"https://api.github.com/repos/yuhr/blog.yuhr.org","state":"closed","state_reason":"completed","timeline_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/2/timeline","title":"崩壊スターレイルやってる","updated_at":"2023-06-08T12:14:53Z","url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/2","user":{"avatar_url":"https://avatars.githubusercontent.com/u/18474125?v=4","events_url":"https://api.github.com/users/yuhr/events{/privacy}","followers_url":"https://api.github.com/users/yuhr/followers","following_url":"https://api.github.com/users/yuhr/following{/other_user}","gists_url":"https://api.github.com/users/yuhr/gists{/gist_id}","gravatar_id":"","html_url":"https://github.com/yuhr","id":18474125,"login":"yuhr","node_id":"MDQ6VXNlcjE4NDc0MTI1","organizations_url":"https://api.github.com/users/yuhr/orgs","received_events_url":"https://api.github.com/users/yuhr/received_events","repos_url":"https://api.github.com/users/yuhr/repos","site_admin":false,"starred_url":"https://api.github.com/users/yuhr/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/yuhr/subscriptions","type":"User","url":"https://api.github.com/users/yuhr"}},{"body":"このたびブログを立ち上げることにした。筆者のプロフィール表示等はまだ実装していないので、誰なのか知りたければとりあえず[GitHubを見てほしい](https://github.com/yuhr)。また、ここでは今後常体でいこうと思う。他の媒体（Zennなど）で書くときに比べて、あまり読みやすさなどに気を払いすぎて手が止まってしまうことがないよう、つらつらと書き殴っていきたい。\r\n\r\n---\r\n\r\nあえて今ブログ立ち上げに至ったのは、何の気なしにTwitterを眺めていたら、それとなく機運の高まりを感じたからだ。\r\n\r\n\u003cblockquote class=\"twitter-tweet\"\u003e\u003cp lang=\"ja\" dir=\"ltr\"\u003eはてなブログに投稿しました \u003ca href=\"https://twitter.com/hashtag/%E3%81%AF%E3%81%A6%E3%81%AA%E3%83%96%E3%83%AD%E3%82%B0?src=hash\u0026amp;ref_src=twsrc%5Etfw\"\u003e#はてなブログ\u003c/a\u003e\u003cbr\u003e言葉だけが最後に残る - 鷲はいまどこを飛ぶか\u003ca href=\"https://t.co/tpUA1kn48E\"\u003ehttps://t.co/tpUA1kn48E\u003c/a\u003e\u003c/p\u003e\u0026mdash; washoe2.2 (@washoe2020) \u003ca href=\"https://twitter.com/washoe2020/status/1650144629017427969?ref_src=twsrc%5Etfw\"\u003eApril 23, 2023\u003c/a\u003e\u003c/blockquote\u003e\r\n\r\n\u003cblockquote class=\"twitter-tweet\"\u003e\u003cp lang=\"ja\" dir=\"ltr\"\u003eとても問題意識に共感する（実際自分も「意識的に記述しておかねば各時点の自分が何を考えていたのかは簡単に揮発してしまう」という問題意識から去年自分用のWebサイト↓を立てたので：\u003cbr\u003e\u003cbr\u003e緒言 - gfnweb \u003ca href=\"https://t.co/7kX5X1wwIw\"\u003ehttps://t.co/7kX5X1wwIw\u003c/a\u003e ）\u003c/p\u003e\u0026mdash; 画力・博士号・油田 (@bd_gfngfn) \u003ca href=\"https://twitter.com/bd_gfngfn/status/1650147533388419072?ref_src=twsrc%5Etfw\"\u003eApril 23, 2023\u003c/a\u003e\u003c/blockquote\u003e\r\n\r\nそれぞれのツイートからリンクされている記事をここからもリンクしておく。\r\n\r\n- [言葉だけが最後に残る - 鷲はいまどこを飛ぶか](https://washibane.hatenablog.com/entry/2023/04/23/232820)\r\n- [緒言 - gfnweb](https://gfngfn.github.io/ja/posts/2022-05-09-preliminary-remarks/)\r\n\r\n---\r\n\r\nこれらの記事を読んだことは行動のトリガーにすぎず、もともと将来的には何かしらのブログのような媒体を利用したいとは思っていた。執筆媒体という括りでいうと、以前はQiitaを利用していたが、最近では[Zennを利用している](https://zenn.dev/yuhr)。少なくとも今までは、ブログよりはこういった単発記事プラットフォームの方が性に合っていたということなのだろう。しかし、そこでも特に最近はエッセイ記事を書くことが多くなり、これもうさっさとブログこさえた方がいいのでは、と漠然と思いつつ特に行動してはいないという状態だった。\r\n\r\nはてなブログにもその他の媒体にも、最後まで食指が動かず、なぜかというとおそらく三日坊主になるのを恐れたのだと思う。これらのBlog as a Serviceとも言うべきマネージドな媒体は、サイトテーマなどを活用して自分好みのブログを作れる感を醸し出しているわりには、とにかく何かしようと思えば自由を制限され、細かい部分を弄れないという事態に直面する経験が繰り返されることで次第に興が削がれていき、どうせその媒体を静かに見捨てることになるのだろう、という先入観がある（これはプロダクトが悪いのではなく単に筆者の性質とのミスマッチの話）。実際、いつだったか、立ち上げて設定を弄くり回しただけでそのまま放置したはてなブログがある。\r\n\r\n---\r\n\r\nGitHub IssuesをヘッドレスCMSとして使って簡単にブログを立ち上げられるようなソフトウェアがそういえばあったな、と思い出して適当にググってみたところ、r7kamuraさんのブログ記事『[GitHub Issuesでブログを書く](https://r7kamura.com/articles/2022-05-03-github-issues-as-blog)』を見つけた。当人作成の[gialog](https://github.com/r7kamura/gialog)というソフトウェアが紹介されていた。他にも[似たようなソリューション](https://zenn.dev/masaino/articles/aad220db388b5a)が世の中にはたくさん存在するらしかったのでいくつかリポジトリを見てみたりした。\r\n\r\nそうしてわかったのは、gialogが最も素晴らしいということだった。 驚くべきことだが、**GitHub上でフォークするだけでブログが立ち上がる**のだ。本当に、文字通り、フォークするだけである。これ以上手順を減らすことはできない。GitHubをすでに日常的に利用しているユーザーが使うブログシステムとしては、間違いなく最高のエルゴノミクスを備えたシステムである。\r\n\r\nそんなわけで、今筆者が立ち上げたこのブログは、gialogを以下のリポジトリにフォークして動かしている。\r\n\r\n- \u003chttps://github.com/yuhr/blog.yuhr.org\u003e\r\n\r\n一応、独自ドメインで動かすためには少しソースコードに[変更](https://github.com/yuhr/blog.yuhr.org/compare/7a0199519be7d4790d667fa84872f277b64bdc1d..95a57e7c4aff82ac7ca6e3ad480f70293e902ca4)を加える必要はあった。また、これらの変更を加えた後、独自ドメインでアクセスするとキャッシュの関係でうまくCSSが当たっていないように見えたりもしたが、待つことで解決された。\r\n\r\nまったく文句がない。魂がこういうものを求めていたことを実感する。\r\n\r\n---\r\n\r\nデモサイトの投稿例を見てみると、一つ面白いことに気づく。\r\n\r\n- 投稿例: \u003chttps://r7kamura.github.io/gialog-example/articles/1\u003e\r\n- 該当するIssue: \u003chttps://github.com/r7kamura/gialog-example/issues/1\u003e\r\n\r\nIssueの最初の投稿だけでなく、そこに付けたコメントまで含めてコンテンツとしてデプロイされ、できあがったブログ記事の下部に追加表示されている。つまり、本題から逸れるような補足などを後から足すといった、ある意味Twitterのようなマイクロブログと従来の古典的ブログとの中間のような執筆スタイルが可能になる。これは[Zennのスクラップ機能](https://zenn.dev/zenn/articles/about-zenn-scraps)を彷彿とさせる、執筆媒体としては新しめのスタイルだと思う。てっきり、この手の（GitHub IssuesをCMSとして使う類の）ブログシステムは、Issueへのコメントは記事の間違いの指摘とかに使われるものと思っていた。\r\n\r\n色々試してみよう。","active_lock_reason":null,"assignee":null,"assignees":[],"author_association":"OWNER","closed_at":"2023-04-27T09:50:34Z","comments":2,"comments_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/1/comments","created_at":"2023-04-26T02:44:59Z","events_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/1/events","html_url":"https://github.com/yuhr/blog.yuhr.org/issues/1","id":1684170800,"labels":[],"labels_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/1/labels{/name}","locked":false,"milestone":null,"node_id":"I_kwDOJbYSL85kYmgw","number":1,"performed_via_github_app":null,"reactions":{"+1":0,"-1":0,"confused":0,"eyes":0,"heart":0,"hooray":0,"laugh":0,"rocket":0,"total_count":0,"url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/1/reactions"},"repository_url":"https://api.github.com/repos/yuhr/blog.yuhr.org","state":"closed","state_reason":"completed","timeline_url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/1/timeline","title":"ブログを立ち上げた","updated_at":"2023-04-27T09:50:34Z","url":"https://api.github.com/repos/yuhr/blog.yuhr.org/issues/1","user":{"avatar_url":"https://avatars.githubusercontent.com/u/18474125?v=4","events_url":"https://api.github.com/users/yuhr/events{/privacy}","followers_url":"https://api.github.com/users/yuhr/followers","following_url":"https://api.github.com/users/yuhr/following{/other_user}","gists_url":"https://api.github.com/users/yuhr/gists{/gist_id}","gravatar_id":"","html_url":"https://github.com/yuhr","id":18474125,"login":"yuhr","node_id":"MDQ6VXNlcjE4NDc0MTI1","organizations_url":"https://api.github.com/users/yuhr/orgs","received_events_url":"https://api.github.com/users/yuhr/received_events","repos_url":"https://api.github.com/users/yuhr/repos","site_admin":false,"starred_url":"https://api.github.com/users/yuhr/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/yuhr/subscriptions","type":"User","url":"https://api.github.com/users/yuhr"}}]},"__N_SSG":true},"page":"/","query":{},"buildId":"LH_DglzRwAhQnfIKREyDt","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
